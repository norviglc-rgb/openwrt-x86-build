name: Publish OpenWrt Releases
on:
  workflow_run:
    workflows: ["OpenWrt 25.12.6 物理机与 Hyper-V"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "lab EFI/ext4 新格式构建的 Actions Run ID"
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: openwrt-release-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 确认源构建成功且来自 main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="${EVENT_RUN_ID:-${INPUT_RUN_ID:-}}"
          [[ -n "$RUN_ID" ]] || { echo "缺少源构建 Run ID"; exit 1; }
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid run_id: $RUN_ID"; exit 1; }
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          echo "$run_json" | jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .head_branch == "main" and .head_repository.full_name == $repo and
            .path == ".github/workflows/build-openwrt.yml" and
            (.event == "push" or .event == "workflow_dispatch")
          ' >/dev/null
          SHA="$(jq -r '.head_sha' <<< "$run_json")"
          RUN_NUMBER="$(jq -r '.run_number' <<< "$run_json")"
          [[ "$RUN_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid run_number"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=v25.12.6-build-$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: 下载并验证 lab EFI/ext4 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_NUMBER: ${{ steps.source.outputs.run_number }}
        run: |
          set -euo pipefail
          artifact="openwrt-25.12.6-lab-efi-ext4-$RUN_NUMBER"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" \
            --pattern "$artifact" -D artifacts
          dir="artifacts/$artifact"
          test -d "$dir"
          test -s "$dir/SHA256SUMS"
          (cd "$dir" && sha256sum --check SHA256SUMS)
          test "$(find "$dir" -maxdepth 1 -type f -name '*.img.gz' | wc -l)" -eq 1
          test "$(find "$dir" -maxdepth 1 -type f -name '*.vhdx' | wc -l)" -eq 0
          test -s "$dir/openwrt-25.12.6-x86-64-generic-ext4-combined-efi.img.gz"
          test -s "$dir/build-info.txt"
          test -s "$dir/requested-packages.txt"
          test "$(find "$dir" -maxdepth 1 -type f -name '*.manifest' | wc -l)" -eq 1

      - name: 准备精简的 Release 附件
        env:
          RUN_ID: ${{ steps.source.outputs.run_id }}
          RUN_NUMBER: ${{ steps.source.outputs.run_number }}
          SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          dir="artifacts/openwrt-25.12.6-lab-efi-ext4-$RUN_NUMBER"
          mkdir -p release
          cp "$dir/openwrt-25.12.6-x86-64-generic-ext4-combined-efi.img.gz" \
            "release/lab-openwrt-25.12.6-x86-64-generic-ext4-combined-efi.img.gz"
          cp "$dir/build-info.txt" release/build-info.txt
          cp "$dir/requested-packages.txt" release/requested-packages.txt
          cp "$dir"/*.manifest release/packages.manifest
          (cd release && sha256sum ./*.img.gz > SHA256SUMS)
          cat > release-notes.md <<EOF
          ## OpenWrt 25.12.6 x86-64 — lab UEFI/ext4

          - Source build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - Build source commit: $SHA
          - Release tag target: main
          - Exactly one physical UEFI/ext4 combined image; no BIOS, SquashFS, base or Hyper-V VHDX.
          - Static checks include SHA256, GPT/UEFI, ext4, and required packages.
          - Do NOT overwrite disks with important existing data partitions.
          - Actual boot, driver, and networking functionality still require hardware tests.
          EOF

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate publication"
            exit 0
          fi
          gh release create "$TAG" release/* \
            -R "$GITHUB_REPOSITORY" \
            --target main \
            --title "OpenWrt 25.12.6 · Build ${TAG##*-}" \
            --notes-file release-notes.md \
            --latest
