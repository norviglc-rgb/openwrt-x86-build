name: OpenWrt 25.12.6 lab UEFI ext4
run-name: "OpenWrt 25.12.6 lab UEFI/ext4 · ${{ github.event_name }}"
on:
  workflow_dispatch:
    inputs:
      rootfs_mib:
        description: "ext4 根分区初始大小（MiB，512–8192）"
        required: false
        default: "2048"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-openwrt.yml"
      - "scripts/build-image.sh"
      - "scripts/build-sdk-packages.sh"
      - "scripts/verify-artifacts.py"
      - "config/gateway/**"
  pull_request:
    paths:
      - ".github/workflows/build-openwrt.yml"
      - "scripts/build-image.sh"
      - "scripts/build-sdk-packages.sh"
      - "scripts/verify-artifacts.py"
      - "config/gateway/**"
permissions:
  contents: read
concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: lab · UEFI ext4
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 ImageBuilder、SDK 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk git wget curl zstd gdisk ca-certificates \
            rsync unzip file python3 python3-setuptools \
            libncurses-dev flex bison gettext libssl-dev subversion \
            autoconf automake cmake libelf-dev zlib1g-dev
      - name: 静态检查
        run: |
          bash -n scripts/build-image.sh scripts/build-sdk-packages.sh
          python3 -m py_compile scripts/verify-artifacts.py
          test -s config/gateway/vendor.lock
          test -s config/gateway/base.packages
          test -s config/gateway/lab.packages
      - name: 生成 lab UEFI/ext4 固件
        env:
          ROOTFS_MIB: ${{ inputs.rootfs_mib || '2048' }}
        run: bash scripts/build-image.sh lab
      - name: 验证镜像（SHA256、GPT/UEFI、ext4、包清单）
        run: python3 scripts/verify-artifacts.py out/lab
      - name: 上传镜像与清单
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-25.12.6-lab-efi-ext4-${{ github.run_number }}
          path: out/lab/
          if-no-files-found: error
          retention-days: 14
