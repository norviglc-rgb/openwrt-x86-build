name: 构建 OpenWrt 25.12.6 x86-64（测试）
on:
  pull_request:
    paths:
      - ".github/workflows/build-openwrt.yml"
      - "scripts/build-image.sh"
      - "config/gateway/**"
      - "README.md"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-openwrt.yml"
      - "scripts/build-image.sh"
      - "config/gateway/**"
permissions:
  contents: read
concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  imagebuilder:
    name: "生成 ${{ matrix.profile }} 测试镜像"
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        profile: [base, lab]
    steps:
      - name: 拉取本仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 安装必需构建工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd curl ca-certificates
      - name: 校验脚本
        run: |
          bash -n scripts/build-image.sh
          test -s config/gateway/base.packages
          test -s config/gateway/lab.packages
          test -s config/gateway/vendor.lock
      - name: 生成镜像
        run: bash scripts/build-image.sh "${{ matrix.profile }}"
      - name: 上传构建产物（不自动发布）
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwrt-25.12.6-x86-64-${{ matrix.profile }}-${{ github.run_number }}
          path: out/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 14
